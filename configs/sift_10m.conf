# SIFT 10M insert+delete sliding window (uint8, 128-dim).
#
# PREREQS (not run-ready out of the box — see configs/README.md for commands):
#   1. INDEX_PREFIX must be a dynamic (update-capable) index built with
#      build_disk_index from the first 10M vectors. build_disk_index writes the
#      required {prefix}_disk.index.tags. (~minutes at 10M.)
#   2. DATA_BIN needs >=20M vectors (10M to seed + 10M to insert). The headerless
#      sift.20M.128.bin is NOT in .bin format; slice a header'd 20M instead:
#        change_pts uint8 sift.100M.128.u8bin 20000000   # -> sift.100M.128.u8bin20000000
#   3. TRUTHSET_DIR filled by compute_groundtruth (topk>=1000 over the 20M) + gt_update.
#
# index_npts=10M, STEP=100 -> 100K deleted+inserted per step, 100 steps = full 10M turnover.

TYPE=uint8
DATA_BIN=/mnt/ssd4t/sarun/fastdann-exp/sift10m/sift.20M.128.u8bin   # 20M header'd slice (see prereq 2)
L_DISK=128
INDEX_PREFIX=/mnt/ssd4t/sarun/fastdann-exp/sift10m/index            # built from first 10M (prereq 1)
QUERY_FILE=/mnt/hdd2t/tyang425/fnct-db-eval/datasets/sift.10K.128.u8.query
TRUTHSET_DIR=/mnt/ssd4t/sarun/fastdann-exp/sift10m/gt               # from gt_update (prereq 3)
RECALL_AT=10
STEP=100
LSEARCH="10 20 30 40 50"
