# SIFT 10M insert+delete sliding window — PSC Bridges-2 RM.
#
# This file is *sourced* by run_experiment.sh INSIDE the Slurm job, after
# tests/psc_bridges2_10m.sbatch has staged the inputs onto the node-local NVMe
# ($LOCAL). So the paths below resolve against $LOCAL at run time — do not point
# them at Ocean (/ocean/...): PipeANN does heavy random I/O and must run on the
# node-local SSD, not the shared Lustre filesystem.
#
# Prepare the inputs once (see the header of tests/psc_bridges2_10m.sbatch and
# configs/README.md): a 10M update-capable index (build_disk_index -> *.tags),
# a >=20M header'd data .bin (10M seed + 10M inserted), the 10K query file, and
# per-checkpoint gt_<N>.bin (compute_groundtruth + gt_update).

TYPE=uint8
DATA_BIN=$LOCAL/sift10m/sift.20M.128.u8bin        # 20M header'd slice (change_pts)
L_DISK=128                                         # candidate-pool L used while inserting
INDEX_PREFIX=$LOCAL/sift10m/index                  # built from the first 10M (has _disk.index.tags)
QUERY_FILE=$LOCAL/sift10m/sift.10K.128.u8.query
TRUTHSET_DIR=$LOCAL/sift10m/gt                      # gt_<N>.bin per checkpoint
RECALL_AT=10
STEP=100                                            # 10M/100 = 100K deleted+inserted per step, 100 steps = full turnover
LSEARCH="10 20 30 40 50"

# Per-event stats CSVs + structural snapshots (both on $LOCAL; copied back to Ocean by the sbatch).
STATS_DIR=$LOCAL/sift10m/stats
INDEX_SNAPSHOT_EVERY=10                             # structural IndexStats snapshot every 10 of the 100 steps
