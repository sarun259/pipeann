# SpaceV 100M insert+delete sliding window (int8, 100-dim).
#
# PREREQS (not run-ready — see configs/README.md). Same shape as sift_100m.conf:
#   1. DATA_BIN: 200M vectors sliced from spacev.1B.100.i8.bin:
#        change_pts int8 spacev.1B.100.i8.bin 200000000
#   2. INDEX_PREFIX: dynamic index built from the first 100M:
#        build_disk_index int8 <first 100M> index 96 128 32 256 112 l2 pq
#   3. TRUTHSET_DIR: compute_groundtruth topk>=1000 over the 200M, then
#        gt_update truth.bin 100000000 200000000 1000000 10 <TRUTHSET_DIR> 0
#
# index_npts=100M, STEP=100 -> 1M deleted+inserted per step, 100 steps.

TYPE=int8
DATA_BIN=/mnt/ssd4t/sarun/fastdann-exp/spacev100m/spacev.200M.100.i8bin  # 200M slice (prereq 1)
L_DISK=128
INDEX_PREFIX=/mnt/ssd4t/sarun/fastdann-exp/spacev100m/index              # built from first 100M (prereq 2)
QUERY_FILE=/mnt/hdd2t/tyang425/fnct-db-eval/datasets/spacev.29316.100.i8.query
TRUTHSET_DIR=/mnt/ssd4t/sarun/fastdann-exp/spacev100m/gt                # from gt_update (prereq 3)
RECALL_AT=10
STEP=100
LSEARCH="10 20 30 40 50 60 80 100"
