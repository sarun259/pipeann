# SIFT 100M insert+delete sliding window (uint8, 128-dim). Mirrors OdinANN fig6.
#
# PREREQS (not run-ready — see configs/README.md; these are the ~hours-long steps):
#   1. DATA_BIN needs 200M vectors (100M seed + 100M insert). Slice from sift.1B:
#        change_pts uint8 sift.1B.128.u8.bin 200000000   # -> ...bin200000000  (~25.6GB)
#   2. INDEX_PREFIX: dynamic index built from the first 100M (~5h, 256GB RAM):
#        build_disk_index uint8 <200M sliced, first 100M> index 96 128 32 256 112 l2 pq
#      (or slice a 100M file first). build_disk_index writes {prefix}_disk.index.tags.
#   3. TRUTHSET_DIR: compute_groundtruth topk>=1000 over the 200M, then
#        gt_update truth.bin 100000000 200000000 1000000 10 <TRUTHSET_DIR> 0
#
# NOTE: the confirmed-clean parquet GTs (gt_sift.parquet) are NOT usable here —
# they are a different format AND insert-only (no deletes). This workload deletes,
# so it needs .bin GT generated for the sliding-window live sets as above.
#
# index_npts=100M, STEP=100 -> 1M deleted+inserted per step, 100 steps.

TYPE=uint8
DATA_BIN=/mnt/ssd4t/sarun/fastdann-exp/sift100m/sift.200M.128.u8bin  # 200M slice (prereq 1)
L_DISK=128
INDEX_PREFIX=/mnt/ssd4t/sarun/fastdann-exp/sift100m/index            # built from first 100M (prereq 2)
QUERY_FILE=/mnt/hdd2t/tyang425/fnct-db-eval/datasets/sift.10K.128.u8.query
TRUTHSET_DIR=/mnt/ssd4t/sarun/fastdann-exp/sift100m/gt              # from gt_update (prereq 3)
RECALL_AT=10
STEP=100
LSEARCH="10 20 30 40 50 60 80 100"
