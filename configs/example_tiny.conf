# Tiny, fully-runnable insert+delete example (finishes in seconds).
#
# Artifacts were generated on /mnt/ssd4t (root fs is full) by:
#   python configs/make_example_data.py --out-dir <DIR> --n 4096 --nq 64 --dim 16 --dtype uint8
#   build/tests/utils/change_pts uint8 data.bin 1024 && mv data.bin1024 data_1024.bin
#   build/tests/build_disk_index uint8 data_1024.bin index 32 64 8 1 4 l2 pq
#   build/tests/utils/compute_groundtruth uint8 l2 data.bin queries.bin 1000 truth.bin null null
#   build/tests/utils/gt_update truth.bin 1024 4096 16 10 gt 0      # 0 = insert+delete
#
# Run it with:
#   PIPEANN_BIN=/mnt/ssd4t/sarun/pipeann-build/tests/overall_performance \
#   LD_LIBRARY_PATH=/mnt/ssd4t/sarun/cblas_shim \
#   ./run_experiment.sh configs/example_tiny.conf

TYPE=uint8                                                   # int8 | uint8 | float
DATA_BIN=/mnt/ssd4t/sarun/fastdann-exp/tiny/data.bin         # full dataset; inserts are pulled from past the initial index
L_DISK=64                                                    # candidate-pool L used while inserting
INDEX_PREFIX=/mnt/ssd4t/sarun/fastdann-exp/tiny/index        # loads {prefix}_disk.index (+ .tags)
QUERY_FILE=/mnt/ssd4t/sarun/fastdann-exp/tiny/queries.bin    # same dtype/dim as DATA_BIN
TRUTHSET_DIR=/mnt/ssd4t/sarun/fastdann-exp/tiny/gt           # per-checkpoint gt_<N>.bin from gt_update
RECALL_AT=10                                                 # k in recall@k
STEP=64                                                      # per step delete+insert index_npts/STEP vecs (1024/64 = 16)
LSEARCH="10 20 40"                                           # search L values to sweep

# Optional per-event stats (raw CSVs). Omit STATS_DIR to disable.
STATS_DIR=/mnt/ssd4t/sarun/fastdann-exp/tiny/stats           # insertions/queries/deletions/index_snapshots .csv
INDEX_SNAPSHOT_EVERY=10                                      # structural IndexStats snapshot every N of the 100 steps (0=off)
